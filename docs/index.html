<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Paper Digest</title><link rel="stylesheet" href="assets/styles.css"></head> <body>  <div class="site-shell"> <aside class="library" aria-label="简报目录"> <div class="library-head"> <div class="brand"> <div class="mark" aria-hidden="true">PD</div> <div class="brand-copy"> <p class="eyebrow">Group Briefing</p> <h1>Paper Digest</h1> </div> </div> <button class="nav-toggle" id="navToggle" type="button" aria-label="收起目录" aria-expanded="true"> <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"> <path d="m15 18-6-6 6-6"></path> </svg> </button> </div> <nav class="digest-list" id="digestList"></nav> <div class="library-foot"> <strong>每周论文简报</strong><br>

</div> </aside> <main class="reader"> <header class="topbar"> <div> <p class="eyebrow" id="activeDate">Latest Issue</p> <h2 id="activeTitle">Weekly Paper Digest</h2> </div> <div class="searchbar" role="search"> <input id="paperSearch" type="search" placeholder="搜索论文、作者、机构、关键词" autocomplete="off"> </div> </header> <section class="search-results" id="searchResults" hidden></section> <article class="issue" id="digestArticle"></article> </main> <button class="notes-toggle" id="notesToggle" aria-label="打开组内笔记" aria-controls="notesDrawer" aria-expanded="false"> <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"> <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path> </svg> </button> <aside class="notes-drawer" id="notesDrawer" aria-hidden="true"> <div class="notes-head"> <div> <p class="eyebrow" id="notesIssue">Current Issue</p> <h3>组内笔记</h3> </div> <button class="close-notes" id="closeNotes" aria-label="关闭组内笔记">×</button> </div> <div class="note-stream" id="noteStream"></div> <form class="note-composer" id="noteComposer"> <div class="note-identity"> <div class="anon-avatar" id="anonAvatar" aria-hidden="true"></div> <div> <p class="note-identity-label">匿名身份</p> <strong id="anonName"></strong> </div> <button class="shuffle-identity" id="shuffleIdentity" type="button">换一个</button> </div> <textarea id="noteText" placeholder="写一条简短笔记"></textarea> <button class="save-note" id="saveNote" type="submit">提交评论</button> <p class="note-hint" id="noteHint">部署评论 Worker 后会写入仓库；当前未配置时会保存在本机草稿。</p> </form> </aside> </div> <script src="assets/runtime-config.js"></script> <script src="assets/data.js"></script> <script src="assets/site.js"></script>  </body></html>
