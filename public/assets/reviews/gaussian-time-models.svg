<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title desc">
<title id="title">规范形变与四维条件化怎样生成目标时刻的高斯</title><desc id="desc">上半图：规范三维高斯经带时间输入的形变网络，生成移动、旋转和变形后的三维基元。下半图：在联合高斯的x-t示意截面上固定时间，得到时间权重与条件三维高斯。几何为示意，不是实验数据。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#586b76" stroke-width="1.4"/></marker></defs>
<rect width="720" height="840" fill="#fafafa"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#263842">
<text x="28" y="43" font-size="29" font-weight="600">两种时间建模的计算过程</text>
<text x="28" y="83" font-size="24">几何为机制示意；不表示动作条件未来预测</text>
<text x="28" y="139" font-size="28" font-weight="600">规范三维高斯 → 形变 → 当前高斯</text>
<g fill="#94b7c7" fill-opacity=".6" stroke="#547a8d" stroke-width="2">
<ellipse cx="95" cy="248" rx="36" ry="18" transform="rotate(-25 95 248)"/><ellipse cx="150" cy="227" rx="40" ry="23" transform="rotate(22 150 227)"/><ellipse cx="150" cy="278" rx="32" ry="19"/>
<ellipse cx="563" cy="227" rx="33" ry="21" transform="rotate(8 563 227)"/><ellipse cx="622" cy="249" rx="43" ry="20" transform="rotate(45 622 249)"/><ellipse cx="593" cy="295" rx="35" ry="16" transform="rotate(-20 593 295)"/>
</g>
<g fill="#263842"><circle cx="95" cy="248" r="3"/><circle cx="150" cy="227" r="3"/><circle cx="150" cy="278" r="3"/><circle cx="563" cy="227" r="3"/><circle cx="622" cy="249" r="3"/><circle cx="593" cy="295" r="3"/></g>
<rect x="278" y="220" width="166" height="84" fill="#fff" stroke="#a9bac2" rx="4"/>
<text x="298" y="254" font-size="26">时空特征</text><text x="312" y="287" font-size="24">形变头</text>
<g fill="none" stroke="#586b76" stroke-width="2.3" marker-end="url(#arrow)"><path d="M203 258H263"/><path d="M453 258H517"/><path d="M361 181V209"/></g>
<text x="319" y="175" font-size="25">时刻 t</text>
<text x="60" y="343" font-size="25">共享规范形状</text><text x="511" y="343" font-size="25">目标时刻形状</text>
<text x="28" y="389" font-size="24">Wu 4D-GS：预测位置、旋转与尺度增量，再投影。</text>
<path d="M28 418H692" stroke="#ccd4d8"/>
<text x="28" y="466" font-size="28" font-weight="600">xyz-t 联合高斯 → 固定 t → 三维切片</text>
<g fill="none" stroke="#586b76" stroke-width="1.8" marker-end="url(#arrow)"><path d="M64 687H281"/><path d="M79 701V507"/></g>
<text x="269" y="716" font-size="23">x</text><text x="55" y="513" font-size="23">t</text>
<ellipse cx="170" cy="605" rx="44" ry="95" transform="rotate(30 170 605)" fill="#94b7c7" fill-opacity=".45" stroke="#547a8d" stroke-width="2"/>
<path d="M61 593H278" stroke="#a65b42" stroke-width="2.4" stroke-dasharray="7 5"/>
<circle cx="177" cy="593" r="5" fill="#a65b42"/><text x="91" y="551" font-size="23">固定时刻</text>
<path d="M290 593H415" stroke="#586b76" stroke-width="2.3" marker-end="url(#arrow)"/>
<ellipse cx="555" cy="593" rx="95" ry="40" transform="rotate(-14 555 593)" fill="#94b7c7" fill-opacity=".6" stroke="#547a8d" stroke-width="2"/>
<circle cx="555" cy="593" r="4" fill="#263842"/>
<text x="103" y="738" font-size="23">仅画 x-t 截面</text><text x="432" y="675" font-size="25">时间权重 G(t)</text><text x="432" y="712" font-size="25">条件高斯 G(x | t)</text>
<text x="28" y="793" font-size="24">Yang 4DGS：切分联合分布，不另设三维形变网络。</text><text x="28" y="825" font-size="21">本站依据两篇原论文整理；完整分类见正文比较表。</text>
</g></svg>
