<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="title desc">
  <title id="title">雷达测量与场景输出的不同坐标</title>
  <desc id="desc">成像雷达的距离方位俯仰Doppler测量与三维空间和时间不同。图中并列当前占据、点云不确定性和未来占据三条任务路线；历史语义另作为未来预测输入。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b76" stroke-width="1.4"/></marker></defs>
  <rect width="720" height="830" fill="#fafafa"/>
  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#263842">
    <text x="28" y="43" font-size="29" font-weight="600">“4D 测量”与“时空预测”使用不同维度</text>
    <rect x="28" y="78" width="664" height="110" rx="5" fill="#eef2f3" stroke="#ccd4d8"/>
    <text x="48" y="121" font-size="27">距离 · 方位 · 俯仰 · Doppler</text>
    <text x="48" y="163" font-size="25">前三项定位散射体；Doppler 约束径向速度</text>
    <g fill="#fff" stroke="#ccd4d8"><rect x="28" y="250" width="664" height="134" rx="5"/><rect x="28" y="412" width="664" height="134" rx="5"/><rect x="28" y="574" width="664" height="170" rx="5"/></g>
    <g font-size="27" font-weight="600"><text x="48" y="292">当前三维占据 · RadarOcc</text><text x="48" y="454">点云与位置不确定性 · RaUF</text><text x="48" y="616">未来占据 · UFMF</text></g>
    <g font-size="25"><text x="48" y="333">球坐标特征 → 笛卡尔体素</text><text x="48" y="368">输出当前空间状态，没有未来时间轴</text>
    <text x="48" y="495">强度 / Doppler → 点位置与各向异性分布</text><text x="48" y="530">点云增强任务，不是 free / unknown 分类</text>
    <text x="48" y="657">历史语义 + 径向 Doppler → 位移先验</text><text x="48" y="696">搬运低维动态特征 → 未来体素</text><text x="48" y="732">完整运动仍由模型结合历史估计</text></g>
    <text x="28" y="226" font-size="24">不同任务分别使用测量、历史与相应监督</text>
    <text x="28" y="793" font-size="23">三条并列任务，使用的测量处理和监督各有不同。</text>
  </g>
</svg>
