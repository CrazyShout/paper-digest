<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img" aria-labelledby="title desc">
  <title id="title">协同感知中的信息传递与校正</title>
  <desc id="desc">发送方先表示与选择观测，经过链路后，接收方校正几何和时间误差并融合。Where2comm和MirrorComm作用于选择，TRB和EgoRefine作用于接收后的校正，底部另列CoSafe的参考轨迹接管权限。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b76" stroke-width="1.4"/></marker></defs>
  <rect width="720" height="790" fill="#fafafa"/>
  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#263842">
    <text x="28" y="42" font-size="29" font-weight="600">选择消息与校正消息位于不同环节</text>
    <g fill="#fff" stroke="#ccd4d8"><rect x="28" y="77" width="664" height="152" rx="5"/><rect x="28" y="319" width="664" height="198" rx="5"/><rect x="28" y="609" width="664" height="116" rx="5"/></g>
    <g font-size="27" font-weight="600"><text x="48" y="117">发送方：编码与空间选择</text><text x="48" y="360">接收方：对齐、校正与融合</text><text x="48" y="650">协同驾驶：信息进入行动</text></g>
    <g font-size="25"><text x="48" y="160">Where2comm：感知置信度 / 接收方请求</text><text x="48" y="199">MirrorComm：预测误差选位置，发送量化观测</text>
    <text x="48" y="401">TRB：位姿变换后的旧特征 + 历史时间残差</text><text x="48" y="440">EgoRefine：当前本车观察引导远端运动对齐</text><text x="48" y="479">V2VNet：接收车本地的图聚合与状态更新</text>
    <text x="48" y="692">CoSafe 的 RSU 可下发并接管参考轨迹</text>
    <text x="391" y="280">链路：带宽、时延、丢包</text><text x="391" y="568">融合表示 / 对象与意图</text></g>
    <g fill="none" stroke="#596b76" stroke-width="2.5" marker-end="url(#a)"><path d="M360 231V310"/><path d="M360 519V600"/></g>
    <text x="28" y="768" font-size="23">本站依据原论文整理；模块位置不代表可直接拼接。</text>
  </g>
</svg>
